mkdir -p ledger
cat << 'EOF' > ledger/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpharetta Electric Co. Ledger</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --primary: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 24px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .card-title { font-size: 0.85rem; color: #64748b; margin-bottom: 4px; }
    .card-value { font-size: 1.5rem; font-weight: 700; }
    .card-value.income { color: var(--green); }
    .card-value.expense { color: var(--red); }
    
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    input, select, button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button.primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-size: 0.85rem; color: #475569; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .delete-btn {
      color: var(--red);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Alpharetta Electric Co. Ledger</h1>
    <p>Schedule C Friendly Income & Expense Log</p>
  </div>

  <div class="metrics">
    <div class="card">
      <div class="card-title">Gross Revenue</div>
      <div class="card-value income" id="total-revenue">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Total Expenses</div>
      <div class="card-value expense" id="total-expenses">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Net Profit / Loss</div>
      <div class="card-value" id="net-profit">$0.00</div>
    </div>
  </div>

  <form id="entry-form">
    <input type="date" id="date" required />
    <select id="type" required>
      <option value="revenue">Revenue</option>
      <option value="expense">Expense</option>
    </select>
    <select id="category" required>
      <option value="Performance / Gig Income">Gig / Performance Income</option>
      <option value="Chart / Music Sales">Chart / App Sales</option>
      <option value="Supplies & Equipment">Supplies & Instruments</option>
      <option value="Software & Subscriptions">Software & Web Hosting</option>
      <option value="Travel & Mileage">Travel / Transport</option>
      <option value="Legal & Professional">Legal & Professional Services</option>
      <option value="Advertising">Marketing & Promotion</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="description" placeholder="Description / Vendor" required />
    <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required />
    <button type="submit" class="primary">Add Entry</button>
  </form>

  <div class="actions">
    <h3>Transaction Records</h3>
    <button class="secondary" onclick="exportToCSV()">Export CSV for CPA</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ledger-body"></tbody>
    </table>
  </div>
</div>

<script>
  let entries = JSON.parse(localStorage.getItem('aec_ledger') || '[]');

  document.getElementById('date').valueAsDate = new Date();

  function saveAndRender() {
    localStorage.setItem('aec_ledger', JSON.stringify(entries));
    const tbody = document.getElementById('ledger-body');
    tbody.innerHTML = '';

    let totalRev = 0;
    let totalExp = 0;

    entries.slice().reverse().forEach((item, index) => {
      const realIndex = entries.length - 1 - index;
      const amount = parseFloat(item.amount);
      if (item.type === 'revenue') totalRev += amount;
      else totalExp += amount;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.date}</td>
        <td><strong>${item.type.toUpperCase()}</strong></td>
        <td>${item.category}</td>
        <td>${item.description}</td>
        <td style="color: ${item.type === 'revenue' ? 'var(--green)' : 'var(--red)'}">
          ${item.type === 'revenue' ? '+' : '-'}$${amount.toFixed(2)}
        </td>
        <td><button class="delete-btn" onclick="deleteEntry(${realIndex})">&times;</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('total-revenue').innerText = `$${totalRev.toFixed(2)}`;
    document.getElementById('total-expenses').innerText = `$${totalExp.toFixed(2)}`;
    const net = totalRev - totalExp;
    const netEl = document.getElementById('net-profit');
    netEl.innerText = `${net < 0 ? '-' : ''}$${Math.abs(net).toFixed(2)}`;
    netEl.style.color = net >= 0 ? 'var(--green)' : 'var(--red)';
  }

  document.getElementById('entry-form').addEventListener('submit', (e) => {
    e.preventDefault();
    entries.push({
      date: document.getElementById('date').value,
      type: document.getElementById('type').value,
      category: document.getElementById('category').value,
      description: document.getElementById('description').value,
      amount: parseFloat(document.getElementById('amount').value)
    });
    document.getElementById('description').value = '';
    document.getElementById('amount').value = '';
    saveAndRender();
  });

  function deleteEntry(index) {
    entries.splice(index, 1);
    saveAndRender();
  }

  function exportToCSV() {
    if (!entries.length) return alert('No transactions to export.');
    let csv = 'Date,Type,Category,Description,Amount\n';
    entries.forEach(e => {
      csv += `"${e.date}","${e.type}","${e.category}","${e.description.replace(/"/g, '""')}",${e.amount}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `alpharetta_electric_ledger_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  saveAndRender();
</script>
</body>
</html>
EOF
